{% extends "base.html" %}
{% block title %}Edit Profile — LAPDOS{% endblock %}
{% block nav_profile %}active{% endblock %}
{% block content %}

<div class="form-wrapper">
  <div class="page-header animate-fade-in">
    <h1 class="page-title">Edit <span class="text-brand-green">Profile</span></h1>
    <p class="page-subtitle">Update your personal information and profile picture.</p>
  </div>

  <form method="post" enctype="multipart/form-data" class="custom-form animate-fade-in stagger-1">
    {% csrf_token %}
    
    <div class="form-group">
      <label class="form-label">First Name</label>
      <input type="text" name="first_name" class="form-input" value="{{ user.first_name }}">
    </div>

    <div class="form-group">
      <label class="form-label">Last Name</label>
      <input type="text" name="last_name" class="form-input" value="{{ user.last_name }}">
    </div>

    <div class="form-group">
      <label class="form-label">Email</label>
      <input type="email" name="email" class="form-input" value="{{ user.email }}">
    </div>

    <div class="form-group">
      <label class="form-label">Country</label>
      <input type="text" name="country" class="form-input" value="{{ profile.country }}">
    </div>

    <div class="form-group">
      <label class="form-label">Nationality</label>
      <input type="text" name="nationality" class="form-input" value="{{ profile.nationality }}">
    </div>

    <div class="form-group">
      <label class="form-label">Social Media Link</label>
      <input type="url" name="social_media_link" class="form-input" value="{{ profile.social_media_link }}">
    </div>

    <div class="form-group">
      <label class="form-label">Gender</label>
      <select name="gender" class="form-input">
        <option value="male" {% if profile.gender == "male" %}selected{% endif %}>Male</option>
        <option value="female" {% if profile.gender == "female" %}selected{% endif %}>Female</option>
        <option value="other" {% if profile.gender == "other" %}selected{% endif %}>Other</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Profile Picture (Avatar)</label>
      <div class="file-upload-zone">
        <input type="file" name="avatar" id="id_avatar" accept="image/*" class="file-input-hidden"/>
        <label for="id_avatar" class="file-upload-label">
          <div class="file-upload-icon">🖼️</div>
          <p class="file-upload-text">Click to upload a new profile picture</p>
        </label>
      </div>
    </div>

    <div style="display: flex; gap: 1rem;">
      <button type="submit" class="btn-primary btn-submit">Save Settings</button>
      <a href="{% url 'profile' %}" class="btn-secondary" style="padding: 0.8rem 1.5rem; text-decoration: none; border-radius: 8px; border: 1px solid var(--border); display: flex; align-items: center;">Cancel</a>
    </div>
  </form>
</div>

<script>
  document.getElementById('id_avatar').addEventListener('change', function(e) {
    const label = this.parentElement;
    if (this.files.length > 0) {
      label.querySelector('.file-upload-text').textContent = '✅ ' + this.files[0].name;
      label.querySelector('.file-upload-icon').textContent = '🖼️';
    }
  });
</script>

{% endblock %}
